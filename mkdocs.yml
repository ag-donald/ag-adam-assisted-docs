site_name: ADAM Instruction Manual
site_description: End-user documentation for ADAM (Academic Data Manager)
site_author: ADAM EduTech
# Rendered by theme/footer.html. Plain text only: it is interpolated into the
# template, not parsed as HTML.
copyright: © 2026 ADAM EduTech. Licensed CC BY-NC-SA 4.0.
# Required for sitemap.xml: MkDocs' sitemap template skips any page without an
# absolute URL, so without this the build writes an empty <urlset>.
site_url: https://help.adam.co.za/

use_directory_urls: false

exclude_docs: |
  assets/screenshots/**/captures.yml

plugins: []

hooks:
  - hooks/youtube_embed.py
  - hooks/sitemap_lastmod.py
  # Registers the `> [!WARNING]` alert syntax as a markdown extension. Must be
  # a hook, not a `markdown_extensions` entry: see the file's own docstring.
  - hooks/github_callouts.py

theme:
  name: null
  custom_dir: theme
  # Must be declared here, not in theme/mkdocs_theme.yml: MkDocs only reads that
  # file for a packaged theme, and this one is name: null. Without this line
  # theme/404.html is never rendered, silently.
  static_templates:
    - 404.html

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 2-4
  - smarty


{# Shared by ordinary help pages and the static 404; no page object required. #}
<div class="searchbar site-search ag-adam-help-search">
    <form action="https://www.google.com/search" method="get" role="search">
        <label for="adam-help-search">Search the ADAM help centre</label>
        <div class="ag-adam-search-row">
            <input id="adam-help-search" type="search" name="q"
                placeholder="Search the ADAM help centre" autocomplete="off">
            <input type="hidden" name="sitesearch" value="help.adam.co.za">
            <button type="submit">Search</button>
        </div>
    </form>
</div>

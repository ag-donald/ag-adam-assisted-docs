- image: matching-uploads-to-people-01.png
  captured: 2026-11-21
  as: staff (staff_id 1, dev blank-password login)
  path: Document Repository bulk upload (/mod/docrep/bulk-upload) → review page
  frame:
    mode: span
    selectors: main h1, the to-check table.match-review-table and details.match-review-folded
    padding: 8
  setup: >
    Eight one-page PDFs uploaded to Pupils (Top Level) > Reports with the
    description "Term 3 report": "KennedyM.pdf" (Probable, Mitchell Kennedy),
    "Singh Damian.pdf" (Check, two current pupils named Damian Singh),
    "Wheelr Thatho.pdf" (No match, Thato Wheeler misspelt) and five full
    names (certain). The batch was cancelled afterwards.
  revert: none — adam_agent_screenshot_pm is a throwaway copy
  site: >
    Captured before phinor/adam#615 (feature/person-matching) was merged, so
    not on the Apache screenshot site: the person-matching worktree at
    7045a686cd/127e96cfb7 (with two review-page fixes made during this run)
    served by php -S at http://screenshotpm.localhost:8125/ against
    adam_agent_screenshot_pm, a copy of adam_agent_screenshot taken
    2026-11-21 with the branch's migrations applied. Open Sans was served from
    the same font files the Apache site uses.
  note: >
    The brief asked for the Check row's drop-down list to be open. A native
    select's open list is drawn outside the page and does not appear in a
    Playwright screenshot, so the list is shown closed at "— choose: 2
    candidates —".


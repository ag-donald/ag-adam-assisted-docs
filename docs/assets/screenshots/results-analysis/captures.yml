  as: staff
  path: Reporting → Results Analysis → View subject averages (the School Subject Averages form)
  frame:
    mode: element
    selectors: form#schoolaverages
    padding: 0
  setup: >
    None. The form is shown as it opens, with ADAM's preselected reporting
    period (Prep Second Cycle Report 2026) and Term Marks.
    emailfromaddress was testing+defaultfrom@adam.co.za before capturing.

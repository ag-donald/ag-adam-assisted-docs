  host: screenshot.theta.adam.co.za (database adam_agent_screenshot, randomised)
  as: staff
  path: Pupil profile of pupil 5250 → academic records → result and aggregate audit, College Trinity Term 2026 (period 48)
  frame:
    mode: span
    selectors: >
      The p holding the academic records menu (the one containing the
      selected "result and aggregate audit" link) down to the bottom of the
      .section holding the reporting period table (td.align-centre).

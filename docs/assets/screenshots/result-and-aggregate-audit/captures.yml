- image: result-and-aggregate-audit-02.png
  captured: 2026-11-17
  host: screenshot.theta.adam.co.za (database adam_agent_screenshot, randomised)
  as: staff
  path: Pupil profile of pupil 5250 → academic records → result and aggregate audit, College Trinity Term 2026 (period 48)
  frame:
    mode: span
    selectors: >
      From the top of .section.result-audit (its heading and summary table)
      to the bottom of the third collapsed details row (Life Orientation).
    padding: 8
  setup: >
    The randomiser gives every assessment a long lorem-ipsum name, which
    filled the "Biggest pull on term" column and overlapped every chart
    label. Before capturing, the period-48 assessments of all nine of the
    pupil's classes (3899, 3945, 3956, 3988, 4658, 4670, 4684, 4825, 4841)
    were renamed through the Edit assessment form: "Classwork N" for the
    Continuous Assessment category and "Exam Paper N" for Examinations;
    in class 4658 (Physical Sciences) "Class Test 1", "Practical 1",
    "Class Test 2", "Exam Paper 1" and "Exam Paper 2". Only the description
    changed; the summary marks were checked unchanged afterwards.
  revert: none (randomised data; the original names were placeholders)


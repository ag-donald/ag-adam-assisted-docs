- image: result-and-aggregate-audit-02.png
  captured: 2026-11-17
  host: screenshot.theta.adam.co.za (database adam_agent_screenshot, randomised)
  as: staff
  path: Pupil profile of pupil 5250 → academic records → result and aggregate audit, College Trinity Term 2026 (period 48)
  frame:
    mode: span
    selectors: >
      From the top of .section.result-audit (its heading and summary table)
      to the bottom of the third collapsed details row (Life Orientation).
    padding: 8
  setup: >
    The randomiser gives every assessment a long lorem-ipsum name, which
    filled the "Biggest pull on term" column and overlapped every chart
    label. Before capturing, the period-48 assessments of all nine of the
    pupil's classes (3899, 3945, 3956, 3988, 4658, 4670, 4684, 4825, 4841)
    were renamed through the Edit assessment form: "Classwork N" for the
    Continuous Assessment category and "Exam Paper N" for Examinations;
    in class 4658 (Physical Sciences) "Class Test 1", "Practical 1",
    "Class Test 2", "Exam Paper 1" and "Exam Paper 2". Only the description
    changed; the summary marks were checked unchanged afterwards.
  revert: none (randomised data; the original names were placeholders)

- image: result-and-aggregate-audit-03.png
  captured: 2026-11-18
  host: screenshot.theta.adam.co.za (database adam_agent_screenshot, randomised)
  as: staff
  path: Pupil profile of pupil 5250 → academic records → result and aggregate audit, College Trinity Term 2026, subject 7 (Physical Sciences) opened
  frame:
    mode: span
    selectors: >
      From the top of details#result-audit-7 to the bottom of the
      .result-audit__table in its first .result-audit__column (the term
      side). The year-to-date side is below the crop.
    padding: 8
  setup: See result-and-aggregate-audit-02.png for the assessment renames.
  revert: none
  note: >
    Recaptured 2026-11-18 on development at f8b0439615 (phinor/adam#598),
    which shortens column names that do not fit ("Class…", "Practi…",
    "Cla…") and puts each bracket's mark and weighting on a second line.
    The first capture, on 2026-11-17, showed the names printed over each
    other and the Continuous Assessment caption cut off at the left edge.
    The term side has no bracket weighted zero, so it has no "Show the
    sections weighted zero" tick box, and the "does not reproduce" note no
    longer appears under it.


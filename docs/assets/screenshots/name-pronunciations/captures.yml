# Captures for docs/name-pronunciations.md.
#
# Images 4 to 8 were taken on 2026-09-22 and images 1 and 9 on 2026-10-28,
# all against the demonstration school on the dev database, driving Playwright directly (the Playwright MCP server is
# not loaded in a session rooted in ~/dev/adam). Viewport 900x1200,
# deviceScaleFactor 1, scale: css, LANG/LANGUAGE/LC_ALL=en_ZA so that
# navigator.languages reads ['en-GB']. Open Sans was confirmed present against
# DejaVu Sans before each run, and light mode confirmed by
# getComputedStyle(document.body).backgroundColor === 'rgb(239, 246, 255)'.
#
# STANDING NOTE ON THE RECORDINGS THEMSELVES: this machine's Chromium cannot
# run the AudioWorklet the recorder is built on — audioWorklet.addModule()
# never settles, under headless and headed alike, on both bundled Chromium
# builds, because WSL2 has no audio device for the audio rendering thread to
# start on. getUserMedia() itself is fine. The clips behind these images were
# therefore posted to ADAM's own ingest endpoint (/pronunciation/record/...)
# from the recorder's own page, with the same CSRF header, content type and
# 16 kHz mono 16-bit WAV the browser encoder emits — the same request the
# recorder makes, minus the microphone. Source and approval state are still
# derived by ADAM from the session, so "From parent" and "Recorded by staff"
# are genuine. Images 2 and 3 of the TODO brief, which need the recorder
# mid-recording and in review, could not be taken at all and remain owed.

- image: name-pronunciations-01.png
  captured: 2026-10-28
  as: staff
  path: Pupils tab → Names and Faces → Record Name Pronunciations by Class → Register Class: Grade 4 CM9 (class 17)
  frame:
    mode: span
    selectors: >
      h2 (the class name); div.pronunciation-class-toolbar (the three
      work-through links); the table head; all 8 tbody rows (Chelsea Mackie
      through Bradford Smith)
    padding: 8 top, 0 bottom
  setup: >
    Retaken for the per-pupil Record action (ADAM branch
    feature/pronunciation-record-pupil), which the September image predates.
    adam_dev had been rebuilt since September: class 7412 no longer exists
    and the pronunciations table was empty. The branch was served from a
    worktree on localhost:8123 against adam_dev, because dev.theta serves
    the main checkout, which was on another branch.

    Class 17 was chosen because its eight pupils fit in one image. Two clips
    were posted to the ingest endpoint as described in the standing note
    above. Harrison Mason (162) was recorded as staff from the new
    one-pupil Record page, giving "Approved (Recorded by staff)". Troy
    McArthur (319) was recorded as his parent, family 194, through
    Families → Security → Login as a family, giving the pending row with
    Approve and Reject. The toolbar reads 8/1/6.

    The demonstration school assigns NO pupil to a pupil login permission
    group and NO group grants "Record name pronunciation", so no parent can
    reach the portal recorder for any child. For Troy's recording, Troy was
    put into the Intermediate Phase group through his profile's
    permissions tab, and the group was given "Record name pronunciation"
    for Families.
  revert: >
    The Families "Record name pronunciation" permission was removed from
    Intermediate Phase straight afterwards, verified by re-reading the
    form. Troy's group assignment STANDS: the per-pupil form has no
    "no group" option, so it cannot be undone through ADAM. Both clips
    stand, and Troy's is still pending.


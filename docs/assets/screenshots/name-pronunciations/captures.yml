  as: staff
  path: Pupils tab → Names and Faces → Approve Name Recordings
  frame:
    mode: span
    selectors: h1; div.pronunciation-class-toolbar; table thead; all 3 tbody rows
    padding: 8 top, 0 bottom
    width: 1100
  setup: >
    Captured at 1100px rather than the house 900px, an exception on the same
    grounds as medical-module-17.png: the table's own width is 1044px, and at
    900 the Clip column is too narrow for the browser to draw a full audio
    control — it collapses to a bare play button and an overflow menu, which
    would misrepresent the screen.

    Three pending recordings were made as the pupils' own parents: Donna Bell
    (family 3766), Xavier Gordon (3674) and Shelley Hancock (3690), each a
    different length so the Length column shows a spread. Two earlier ones,
    Moira Morgan and Daniel Erasmus, were REJECTED through this screen's own
